name: Recorded extractor replay

on:
  push:
    branches:
      - fix/mixed-load-specialists-v48
    paths:
      - 'tests/replay/**'
      - 'supabase/functions/vanhub-chat-kernel/**'
      - 'supabase/functions/vanhub-chat-confirm/**'
      - 'supabase/functions/vanhub-chat-confirm-candidate/**'
      - '.github/workflows/replay-regressions.yml'
  pull_request:
    paths:
      - 'tests/replay/**'
      - 'supabase/functions/vanhub-chat-kernel/**'
      - 'supabase/functions/vanhub-chat-confirm/**'
      - 'supabase/functions/vanhub-chat-confirm-candidate/**'
      - '.github/workflows/replay-regressions.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run recorded extractor replay tests
        run: deno test --allow-read --allow-net=raw.githubusercontent.com tests/replay/recorded-extractor-replay.test.ts
